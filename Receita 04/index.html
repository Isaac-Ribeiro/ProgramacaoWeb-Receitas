<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Receita HTML + JS - Arrays</title>

  <!-- Exercício 2: -->
  <style>
    .cerveja {
      display: inline-block;
      background-color: #2c3e50;
      color: white;
      padding: 10px 18px;
      margin: 6px;
      border-radius: 8px;
      font-family: Arial, sans-serif;
      font-size: 18px;
    }

    /* Exercício 3: */
    table {
      border-collapse: collapse;
      margin-top: 10px;
      font-family: Arial, sans-serif;
    }

    th, td {
      border: 1px solid #888;
      padding: 8px 20px;
      text-align: left;
    }

    th {
      background-color: #2c3e50;
      color: white;
    }

    button {
      margin: 4px;
      padding: 6px 12px;
    }
  </style>
</head>

<body>

  <div id="botoes">
    <button id="botaoCarregar">Carregando cervejas...</button>
    <button id="botaoTabela">Ver como tabela</button>
    <button id="botaoOrdenar">Mostrar cervejas ordenadas</button>
    <button id="botaoEmbaralhar">Embaralhar cervejas</button>
  </div>

  <div id="meu amor"></div>

  <script>
    let cervejas = ["Guiness", "Desperados", "Becks", "Heineken", "Corona"]

    let ultimoModo = "divs"

    function transformarDiv(item) {
      return `<div class="cerveja">${item}</div>`
    }
    function transformarLinha(item) {
      return `<tr><td>${item}</td></tr>`
    }

    function renderizar() {
      let div = document.getElementById("meu amor")

      if (ultimoModo === "tabela") {
        let linhasHtml = cervejas.map(transformarLinha)
        div.innerHTML = `
          <table>
            <tr><th>Cerveja</th></tr>
            ${linhasHtml.join("\n")}
          </table>
        `
      } else {
        let cervejasHtml = cervejas.map(transformarDiv)
        div.innerHTML = `${cervejasHtml.join("\n")}`
      }
    }

    function carregarDiv() {
      ultimoModo = "divs"
      renderizar()
    }

    function carregarTabela() {
      ultimoModo = "tabela"
      renderizar()
    }

    // Exercício 4:
    function ordenarCervejas() {
      cervejas.sort()
      renderizar()
    }

    // Exercício 5: 

    function embaralharCervejas() {
      cervejas.sort(function () {
        return Math.random() - 0.5
      })
      renderizar()
    }

    let botao = document.getElementById("botaoCarregar")
    botao.addEventListener("click", carregarDiv)

    let botaoTabela = document.getElementById("botaoTabela")
    botaoTabela.addEventListener("click", carregarTabela)

    let botaoOrdenar = document.getElementById("botaoOrdenar")
    botaoOrdenar.addEventListener("click", ordenarCervejas)

    let botaoEmbaralhar = document.getElementById("botaoEmbaralhar")
    botaoEmbaralhar.addEventListener("click", embaralharCervejas)
  </script>

</body>
</html>
